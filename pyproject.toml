[project]
name = "nyc-trip-duration-kfp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff~=0.16.0",
    "mypy~=2.3.0",
    "pytest~=9.1.0",
    "pytest-cov",
    "pre-commit>=4.6.2",
]
# Phase 3 fills this group: kfp, kfp-kubernetes.
pipeline = []
# Phase 2 fills this group: pandas, numpy, pyarrow, pandera, lightgbm, mlflow.
ml = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["path", ".planning"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lib --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["lib"]
branch = true
