[project]
name = "nyc-trip-duration-kfp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff~=0.16.0",
    "mypy~=2.3.0",
    "pytest~=9.1.0",
    "pytest-cov",
    "pre-commit>=4.6.2",
    "pandas-stubs",
    "pyshp",
    "pyproj",
]
pipeline = [
    "kfp==2.17.0",
    "kfp-kubernetes==2.17.0",
    "boto3",
]
ml = [
    "pandas>=2.3,<2.4",
    "numpy>=2.5,<2.6",
    "pyarrow",
    "pandera==0.32.1",
    "lightgbm==4.7.0",
    "mlflow==3.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["path", ".planning"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

# boto3 ships no py.typed marker / stub package (mirrors the pyarrow mypy
# override above): every boto3 client method resolves to Any regardless, so
# the `client: Any` parameter lib/artifacts.py's S3 adapter functions carry
# is the only honest annotation available, not a general strictness relaxation.
[tool.ruff.lint.per-file-ignores]
"lib/artifacts.py" = ["ANN401"]
# mlflow ships no py.typed marker / stub package either; every attribute
# resolves to Any regardless. lib/tracking.py's mlflow_module: Any parameter
# is the injected-module seam (mirrors lib/registry.py's client injection),
# not a general strictness relaxation - same rationale as the artifacts.py
# entry above.
"lib/tracking.py" = ["ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["lib"]

# pyarrow ships no py.typed marker / stub package; every attribute resolves
# to Any regardless. Silencing the missing-stub note is standard practice
# for this specific library rather than a general strictness relaxation.
[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

# boto3 ships no py.typed marker / stub package either; same rationale as the
# pyarrow override above, not a general strictness relaxation.
[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lib --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["lib"]
branch = true
