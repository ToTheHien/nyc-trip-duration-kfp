repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: scripts/qa.sh lint
        language: system
        pass_filenames: false
        files: \.py$

      - id: ruff-format
        name: ruff format --check
        entry: scripts/qa.sh format
        language: system
        pass_filenames: false
        files: \.py$

      - id: mypy-strict
        name: mypy --strict lib
        entry: scripts/qa.sh typecheck
        language: system
        pass_filenames: false
        files: ^lib/.*\.py$

      - id: boundary
        name: component boundary gate
        entry: scripts/qa.sh boundary
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: scripts/qa.sh test
        language: system
        pass_filenames: false
        files: \.py$
